name: Keep Render Backend Awake

on:
  schedule:
    # Run every 14 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            # Default fallback domain if secret not explicitly configured
            BACKEND_URL="https://svasc.onrender.com"
          fi
          echo "Pinging $BACKEND_URL/api/health..."
          curl -f -s -m 30 "$BACKEND_URL/api/health" || curl -f -s -m 30 "$BACKEND_URL/health" || echo "Ping dispatched"
