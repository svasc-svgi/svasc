<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/SVCAS-Logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVASC</title>
  <!-- Preconnect to image CDNs for fast image loading -->
  <link rel="preconnect" href="https://images.pexels.com" crossorigin />
  <link rel="dns-prefetch" href="https://images.pexels.com" />
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- DNS Prefetch & Preconnect for faster external resource loading -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ALL Google Fonts in ONE request (eliminates 4 separate HTTP round-trips) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Epilogue:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Dancing+Script:wght@400;600;700&family=Cormorant+Infant:ital,wght@1,400;1,600&family=Poppins:wght@400;500;600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome (single version - removed duplicate v5 that was also loaded) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </noscript>

  <!-- Bootstrap CSS (deferred non-blocking load) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </noscript>
</head>

<body>
  <div id="root"></div>

  <!-- All scripts deferred to load after DOM is ready (non-render-blocking) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/3.4.2/js/swiper.jquery.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
